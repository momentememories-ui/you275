<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Anniversary💚</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #eef7f1; /* สีพื้นหลังโทนเขียวพาสเทลอ่อน */
            font-family: 'Kanit', sans-serif;
            color: #1b4332; /* สีตัวอักษรเขียวเข้ม */
            position: relative;
        }

        /* Floating Cat & Paw Layer */
        #paw-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 99;
            overflow: hidden;
        }

        .floating-item {
            position: absolute;
            bottom: -50px;
            font-size: 24px;
            animation: floatUp linear forwards;
            opacity: 0.9;
            filter: drop-shadow(0 2px 5px rgba(45, 106, 79, 0.25));
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.8) rotate(0deg);
                opacity: 1;
            }
            50% {
                transform: translateY(-50vh) scale(1.2) rotate(15deg);
            }
            100% {
                transform: translateY(-110vh) scale(1) rotate(-15deg);
                opacity: 0;
            }
        }

        /* Continuous Background Layer for Pages 1-4 (Cover Full Screen) */
        #main-bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #f4faf6;
            background-image: url('photo6.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
            transition: opacity 0.8s ease;
        }

        /* App Container */
        .app-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        /* Scratch Card Area (1:1 Ratio) */
        .scratch-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            transition: opacity 0.6s ease;
            opacity: 1;
        }

        .scratch-area {
            position: relative;
            width: 320px;
            height: 320px;
            max-width: 85vw;
            max-height: 85vw;
            border-radius: 24px;
            overflow: hidden;
            border: 5px solid #ffffff; /* กรอบสีขาว */
            box-shadow: 0 12px 28px rgba(45, 106, 79, 0.22); /* เงาสีเขียวละมุน */
            background: #ffffff;
        }

        .scratch-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 0.5s ease;
        }

        .scratch-area canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            touch-action: none;
        }

        /* Final Page 5 Style (Full Screen photo5.png) */
        #page-final {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #eef7f1;
            background-image: url('photo5.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
        }

        #page-final.active {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <!-- Floating Cats & Paws Layer -->
    <div id="paw-container"></div>

    <!-- Static Background for Scratch Pages -->
    <div id="main-bg-layer"></div>

    <!-- Audio Element -->
    <audio id="bg-music" loop preload="auto">
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <!-- Main Scratch Frame -->
    <div class="app-container">
        <div class="scratch-wrapper" id="scratch-wrapper">
            <div class="scratch-area">
                <img id="reveal-img" src="photo1.jpg" alt="Memory">
                <canvas id="scratch-canvas"></canvas>
            </div>
        </div>
    </div>

    <!-- PAGE 5 (Full Screen photo5.png) -->
    <div id="page-final"></div>

    <script>
        // Audio Setup
        const music = document.getElementById('bg-music');
        window.addEventListener('DOMContentLoaded', () => {
            music.play().catch(() => {
                document.addEventListener('touchstart', () => music.play(), { once: true });
                document.addEventListener('click', () => music.play(), { once: true });
            });
        });

        // Floating Cats & Paws Generator
        const pawContainer = document.getElementById('paw-container');
        const catEmojis = ['🐾', '🌿', '🤍', '💚', '🍀'];

        function spawnCatItem() {
            const item = document.createElement('div');
            item.classList.add('floating-item');
            item.textContent = catEmojis[Math.floor(Math.random() * catEmojis.length)];
            item.style.left = Math.random() * 100 + 'vw';
            item.style.animationDuration = (Math.random() * 2 + 3) + 's';
            item.style.fontSize = (Math.random() * 15 + 20) + 'px';
            pawContainer.appendChild(item);

            setTimeout(() => { item.remove(); }, 5000);
        }

        let itemInterval = null;
        function startCatShower() {
            if (!itemInterval) {
                itemInterval = setInterval(spawnCatItem, 300);
            }
        }

        function triggerCatBurst(count = 25) {
            for (let i = 0; i < count; i++) {
                setTimeout(spawnCatItem, i * 80);
            }
        }

        // Photos Config
        const photos = ['photo1.jpg', 'photo2.jpg', 'photo3.jpg', 'photo4.jpg'];
        let currentStep = 0;

        const scratchWrapper = document.getElementById('scratch-wrapper');
        const revealImg = document.getElementById('reveal-img');
        const canvas = document.getElementById('scratch-canvas');
        const ctx = canvas.getContext('2d');
        const size = 1024;

        canvas.width = size;
        canvas.height = size;

        const overlayImg = new Image();
        overlayImg.src = 'photo.jpg';

        // วาดลายเท้าแมวและหน้าแมวบนแผ่นขูด (ใช้กรณีไม่มีไฟล์ photo.jpg หรือกำลังโหลด)
        function drawDefaultCatOverlay() {
            // พื้นหลังสีเขียวพาสเทล
            ctx.fillStyle = '#a3d9b1';
            ctx.fillRect(0, 0, size, size);

            // วาดลายจุดขาวเล็กๆ
            ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
            for (let x = 80; x < size; x += 160) {
                for (let y = 80; y < size; y += 160) {
                    ctx.beginPath();
                    ctx.arc(x, y, 14, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // วาดรอยเท้าแมวสีขาวตรงกลาง
            ctx.fillStyle = '#ffffff';
            // อุ้งเท้าใหญ่
            ctx.beginPath();
            ctx.ellipse(size / 2, size / 2 + 35, 95, 75, 0, 0, Math.PI * 2);
            ctx.fill();

            // นิ้วเท้า 4 นิ้ว
            const toes = [
                { x: size / 2 - 105, y: size / 2 - 45, angle: -0.35 },
                { x: size / 2 - 38,  y: size / 2 - 85, angle: -0.12 },
                { x: size / 2 + 38,  y: size / 2 - 85, angle: 0.12 },
                { x: size / 2 + 105, y: size / 2 - 45, angle: 0.35 }
            ];
            toes.forEach(toe => {
                ctx.beginPath();
                ctx.ellipse(toe.x, toe.y, 32, 44, toe.angle, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function resetCanvas() {
            ctx.globalCompositeOperation = 'source-over';
            if (overlayImg.complete && overlayImg.naturalWidth !== 0) {
                ctx.drawImage(overlayImg, 0, 0, size, size);
            } else {
                drawDefaultCatOverlay();
            }
        }

        overlayImg.addEventListener('load', resetCanvas);

        let isDrawing = false;
        let completed = false;

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function scratch(e) {
            if (!isDrawing || completed) return;
            if (e.cancelable) e.preventDefault();

            const pos = getPos(e);
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 80, 0, Math.PI * 2);
            ctx.fill();

            checkProgress();
        }

        function checkProgress() {
            if (completed) return;

            const imgData = ctx.getImageData(0, 0, size, size);
            const pixels = imgData.data;
            let transparentPixels = 0;

            for (let i = 3; i < pixels.length; i += 64) {
                if (pixels[i] === 0) transparentPixels++;
            }

            const totalSampled = (pixels.length / 4) / 16;
            const percent = (transparentPixels / totalSampled) * 100;

            if (percent >= 90) {
                completed = true;
                ctx.clearRect(0, 0, size, size);

                if (currentStep === 3) {
                    // Page 4 Completed
                    triggerCatBurst(35);
                    
                    // Delay 5 seconds on Page 4 before moving to Page 5
                    setTimeout(() => {
                        showFinalPage();
                    }, 5000);
                } else {
                    // Pages 1-3 Completed: Switch smoothly to next photo
                    setTimeout(() => {
                        nextPhoto();
                    }, 1200);
                }
            }
        }

        function nextPhoto() {
            scratchWrapper.style.opacity = '0';

            setTimeout(() => {
                currentStep++;
                revealImg.src = photos[currentStep];
                resetCanvas();
                completed = false;
                
                scratchWrapper.style.opacity = '1';
            }, 600);
        }

        function showFinalPage() {
            document.getElementById('main-bg-layer').style.opacity = '0';
            scratchWrapper.style.opacity = '0';
            
            setTimeout(() => {
                const finalPage = document.getElementById('page-final');
                finalPage.classList.add('active');
                triggerCatBurst(40);
                startCatShower();
            }, 800);
        }

        // Scratch Events
        canvas.addEventListener('mousedown', (e) => { isDrawing = true; scratch(e); });
        canvas.addEventListener('mousemove', scratch);
        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mouseleave', () => isDrawing = false);

        canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); }, { passive: false });
        canvas.addEventListener('touchmove', scratch, { passive: false });
        canvas.addEventListener('touchend', () => isDrawing = false);

        // Initial Canvas Load
        resetCanvas();
    </script>
</body>
</html>
